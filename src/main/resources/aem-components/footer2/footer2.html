<sly data-sly-use.model="com.aem.check.core.models.Footer2Model"/>
<sly data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"/>
<sly data-sly-test.hasContent="${!model.empty}">
  <sly data-sly-test="${model.maintitle}">
    <p>Maintitle: ${model.maintitle}</p>
  </sly>
  <sly data-sly-test="${model.footerlinks && model.footerlinks.size > 0}">
    <ul data-sly-list.item="${model.footerlinks}">
      <sly data-sly-test="${item.footerlink}">
       <a href="${item.footerlink}">${item.footername}</a>
      </sly>
    </ul>
  </sly>
  <sly data-sly-test="${model.socialmediaicons && model.socialmediaicons.size > 0}">
    <ul data-sly-list.item="${model.socialmediaicons}">
            <sly data-sly-test="${item.icon}">
              <a href="${item.iconlink}"> <img src="${item.icon}" alt="Icon" style="max-width:100%; height:auto;"/></a>
      </sly>
    </ul>
  </sly>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty = !hasContent}"/>
