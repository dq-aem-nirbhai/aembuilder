<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Policy</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/policies.css}">
  
  <!-- Intro.js for Quick Tour -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid mt-4">
  <a th:href="@{'/view/' + ${projectName}}" class="btn btn-outline-secondary mb-3">← Back to Deploy Page</a>
  <h2>Create Policy for Template (Container Policies)</h2>

  <form id="policyForm" class="mt-4">
    <input type="hidden" id="projectname" th:value="${projectName != null ? projectName : ''}">
    <input type="hidden" id="templateName" th:value="${templateName != null ? templateName : ''}">

    <div class="row">
      <!-- Left Column -->
      <div class="col-md-6">
        <div class="section-title">Policy</div>

        <div class="mb-3" data-step="1" data-intro="Select an existing policy if available, or create a new one">
          <label for="existingPolicy">Select Policy</label>
          <select id="existingPolicy" class="form-select">
            <option value="">-- Select Existing Policy --</option>
            <th:block th:each="policy : ${existingPolicies}">
              <option th:value="${policy}" th:text="${policy}"></option>
            </th:block>
          </select>
        </div>

        <div class="mb-3" data-step="2" data-intro="Enter the title for your new policy here">
          <label for="newPolicyTitle">Policy Title *</label>
          <input type="text" id="newPolicyTitle" name="newPolicyTitle" class="form-control"
                 placeholder="Enter new policy title"
                 th:value="${policyRequest != null ? policyRequest.name : ''}">
        </div>

        <div class="mb-3" data-step="3" data-intro="Set the default CSS class for this policy">
          <label for="styleDefaultClasses">Default Class</label>
          <input type="text" id="styleDefaultClasses" name="styleDefaultClasses"
                 class="form-control" placeholder="Default Class" required>
        </div>

        <div class="mb-3" data-step="4" data-intro="Select the default HTML element for this policy">
          <label for="styleDefaultElement">Default Element</label>
          <select name="styleDefaultElement" id="styleDefaultElement" class="form-select" required>
            <option value="" selected>-- Select Element --</option>
            <option value="div">div</option>
            <option value="section">section</option>
            <option value="article">article</option>
            <option value="main">main</option>
            <option value="aside">aside</option>
            <option value="header">header</option>
            <option value="footer">footer</option>
          </select>
        </div>
      </div>

      <!-- Right Column -->
      <div class="col-md-6">
        <div class="section-title">Properties</div>

        <ul class="nav nav-tabs" id="policyTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="components-tab" data-bs-toggle="tab"
                    data-bs-target="#componentsTab" type="button" role="tab"
                    data-step="5" data-intro="Here you can select allowed components for this policy">Allowed Components</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="styles-tab" data-bs-toggle="tab"
                    data-bs-target="#stylesTab" type="button" role="tab"
                    data-step="6" data-intro="Manage style groups for this policy">Style Groups</button>
          </li>
        </ul>

        <div class="tab-content mt-3">
          <div class="tab-pane fade show active" id="componentsTab" role="tabpanel">
            <div id="accordionContainer"></div>
            <div class="mt-3" data-step="7" data-intro="The selected component paths will appear here">
              <p><strong>Selected Component Path:</strong></p>
              <pre id="componentPathOutput">[]</pre>
            </div>
          </div>

          <div class="tab-pane fade" id="stylesTab" role="tabpanel">
            <div id="styleGroups"></div>
            <button type="button" class="add-btn" onclick="addStyleGroup()" data-step="8" data-intro="Add new style groups using this button">+ Add Style Group</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-end" data-step="9" data-intro="Click here to save the policy once configured">
      <button type="button" id="addPolicyBtn" class="submit-btn" onclick="submitPolicy()" disabled>Add Policy</button>
    </div>
  </form>
</div>

<div id="spinner-overlay" class="spinner-overlay d-none">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div th:replace="fragments/navbar :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Intro.js -->
<script src="https://cdn.jsdelivr.net/npm/intro.js/minified/intro.min.js"></script>

<script th:src="@{/js/policies.js}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Start Quick Tour only once per user
  if (!localStorage.getItem("policyTourShown")) {
    introJs().setOptions({
      showStepNumbers: true,
      showBullets: true,
      nextLabel: 'Next →',
      prevLabel: '← Back',
      skipLabel: '×',
      doneLabel: 'Finish',
      exitOnOverlayClick: true
    }).start();
    localStorage.setItem("policyTourShown", "true");
  }
});
</script>
</body>
</html>
