<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>403 - Forbidden</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      /* Soft gradient background with rgba light blue + light pink */
      background: linear-gradient(
        135deg,
        rgba(173, 216, 230, 0.6),  /* light blue */
        rgba(255, 182, 193, 0.6)   /* light pink */
      );
      color: #333;
    }

    .error-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 90%;
      backdrop-filter: blur(6px);
    }

    .error-code {
      font-size: 6rem;
      font-weight: 600;
      line-height: 1;
      color: #007bff; /* primary dashboard blue */
    }

    .error-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #007bff, #6f42c1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    .error-message {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #555;
    }

    .btn-custom {
      background-color: #28a745; /* green like Create Project */
      color: #fff;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s;
      border: none;
    }

    .btn-custom:hover {
      background-color: #218838;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #ff4b2b; /* forbidden red, subtle contrast */
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="icon">🚫</div>
  <div class="error-code">403</div>
  <div class="error-title">Forbidden</div>
  <p class="error-message" th:text="${errorMessage}">
    Sorry, you don’t have permission to access this page.
  </p>
  <a href="/" class="btn btn-custom">Back to Home</a>
</div>
</body>
</html>
