<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEM Builder - Project Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="/css/deploy.css" />
</head>

<body class="d-flex flex-column min-vh-100">
<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<script>
    // Restrict actions on main/dev branches
    function checkRestrictedBranch(actionName) {
        const branchName = document.getElementById('branchName').innerText.trim();
        if (branchName === 'main' || branchName === 'dev') {
            alert(`Hey! You are in the restricted branch. Switch to a specific branch to ${actionName}.`);
            return false;
        }
        return true;
    }
</script>

<main class="flex-grow-1">
    <div class="container mt-4">

        <!-- Branch Controls -->
        <div class="d-flex align-items-center mb-3">
            <span class="me-2 fw-bold">Current Branch:</span>
            <span id="branchName" th:text="${branch}" class="badge bg-info me-3"></span>

            <!-- Switch Branch -->
            <form th:action="@{'/' + ${projectName} + '/switchBranch'}" method="post" class="d-flex me-3">
                <select name="branchName" class="form-select form-select-sm me-2">
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${b}" th:selected="${b == branch}"></option>
                </select>
                <button type="submit" class="btn btn-sm btn-outline-primary">Switch</button>
            </form>

            <!-- Create Branch -->
            <form th:action="@{'/' + ${projectName} + '/createBranch'}" method="post" class="d-flex">
                <input type="text" name="newBranch" placeholder="new-branch-name" class="form-control form-control-sm me-2" required />
                <select name="fromBranch" class="form-select form-select-sm me-2" required>
                    <option value="" disabled selected th:if="${#lists.isEmpty(branches)}">No branches</option>
                    <option th:each="b : ${branches}" th:value="${b}" th:text="${'from: ' + b}" th:selected="${b == branch}"></option>
                </select>
                <button type="submit" class="btn btn-sm btn-outline-success">Create & Switch</button>
            </form>
        </div>

        <!-- Title + Navigation -->
        <h2 class="mb-3 text-primary" th:text="'Project: ' + ${projectName}"></h2>
        <a href="/dashboard" class="btn btn-outline-secondary mb-3">← Back to Dashboard</a>

        <!-- Flash Messages -->
        <div th:if="${message}" id="flashMessage" class="flash-message">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${message}"></span>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-end mb-3">
            <button id="saveBtn" class="btn btn-outline-success me-2" style="display:none" onclick="saveAll()">Save</button>
            <a id="deployBtn"
               th:href="@{'/' + ${projectName} + '/deploy'}"
               class="btn btn-warning"
               th:classappend="${!canDeploy} ? ' disabled' : ''"
               th:attrappend="aria-disabled=${!canDeploy}">
                Deploy to AEM
            </a>
        </div>

        <!-- Components & Templates -->
        <div class="row g-4">
            <!-- Components -->
            <div class="col-md-6">
                <div id="newComponentsContainer" style="display:none;">
                    <h6 class="text-success">Newly Added Components</h6>
                    <div id="newComponentsList" class="row row-cols-1 row-cols-sm-2 g-2"></div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4>Components</h4>
                    <div class="d-flex gap-2">
                        <a th:href="@{'/createComponent/' + ${projectName}}" class="btn btn-sm btn-outline-primary"
                           onclick="return checkRestrictedBranch('create a component')">+ Create Component</a>
                        <a href="#" class="btn btn-sm btn-outline-primary"
                           onclick="return checkRestrictedBranch('open component library') && openComponentModal()">+ Component Library</a>
                        <a th:href="@{'/' + ${projectName} + '/artifacts/artifact-generator'}"
                           class="btn btn-sm btn-outline-primary"
                           onclick="return checkRestrictedBranch('generate artifacts')">Generate New Features</a>
                    </div>
                </div>

                <div id="componentsList" class="row row-cols-1 row-cols-sm-2 g-2">
                    <div class="col" th:each="component : ${components}">
                        <div class="border rounded p-2 bg-light d-flex justify-content-between align-items-center shadow-sm">
                            <span th:text="${component}"></span>
                            <a th:if="${#lists.contains(editableComponents, component)}"
                               th:href="@{/{projectName}/editcomponent(componentName=${component}, projectName=${projectName})}"
                               class="btn btn-sm btn-outline-secondary ms-2"
                               onclick="return checkRestrictedBranch('edit this component')">Edit</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Templates -->
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h4>Templates</h4>
                    <a th:href="@{/{projectName}/createtemplate(projectName=${projectName})}" class="btn btn-sm btn-outline-primary"
                       onclick="return checkRestrictedBranch('create a template')">Create Template</a>
                </div>

                <div id="templatesList" class="row row-cols-1 row-cols-sm-2 g-2">
                    <div class="col" th:each="template : ${templates}">
                        <div class="border rounded p-2 bg-light d-flex justify-content-between align-items-center shadow-sm">
                            <a th:href="@{/{projectName}/templates/{template}/components(projectName=${projectName},template=${template})}" class="text-decoration-none" th:text="${template}"></a>
                            <div class="d-flex">
                                <a th:if="${template != 'page-content' and template != 'xf-web-variation'}"
                                   th:href="@{/{projectName}/edittemplate(templateName=${template}, projectName=${projectName})}"
                                   class="btn btn-sm btn-outline-secondary ms-2"
                                   onclick="return checkRestrictedBranch('edit this template')">Edit</a>
                                <a th:if="${template != 'page-content' and template != 'xf-web-variation'}"
                                   th:href="@{/{projectName}/addpolicy(templateName=${template}, projectName=${projectName})}"
                                   class="btn btn-sm btn-outline-primary ms-2"
                                   onclick="return checkRestrictedBranch('add policy')">Add Policy</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>



<!-- Artifact Modal -->
<div class="modal fade" id="artifactModal" th:attr="data-project=${projectName}" tabindex="-1" aria-labelledby="artifactModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="artifactModalLabel">Select Artifacts (Servlets, Services, Sling Models, etc.)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="artifactList" class="container-fluid">
                    <p class="text-muted">Loading...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="generateSelectedArtifacts()">Generate</button>
            </div>
        </div>
    </div>
</div>


<!-- ========================= -->
<!-- Tools Library Section -->
<!-- ========================= -->
<div class="mt-5 p-4 border rounded bg-light shadow-sm">
    <h4 class="text-primary mb-3">🧰 Tools Library</h4>
    <div class="d-flex justify-content-end mb-2">
        <button class="btn btn-sm btn-outline-primary" onclick="openToolModal()">+ Tool Library</button>
    </div>
</div>

<!-- Tool Modal -->

<div class="modal fade" id="toolModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Select Tools</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="toolList" class="row row-cols-2 g-3"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-primary" onclick="addSelectedTools()">Add Selected</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/navbar :: footer"></div>


<!-- Scripts -->

<script src="/js/deploy.js"></script>
<script src="/js/artifactController.js"></script>

</body>
</html>
