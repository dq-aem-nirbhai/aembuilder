<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Artifact Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    /* Side-by-side layout */
    .main-content {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .artifact-section, .tools-section {
      flex: 1 1 35%;
      min-width: 400px;
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    @media (max-width: 992px) {
      .main-content { flex-direction: column; }
    }

    .list-group-item:hover { background: #f8f9fa; }
  </style>
</head>

<body>
  <div th:replace="fragments/navbar :: navbar"></div>

  <main class="container mt-4 animate__animated animate__fadeIn">
     <a th:href="@{'/view/' + ${projectName}}" class="btn btn-outline-secondary mb-3">← Back to DeployPage</a>

    <div class="main-content">

      <!-- Left: Artifact Library -->
      <div class="artifact-section">
        <h2>Java Toolkit</h2>
        <p>Browse through the tools library.</p>

        <div class="mb-3">
          <button id="showFormBtn" class="btn btn-primary">➕ Generate New Javaclass</button>
        </div>

        <!-- Artifact List -->
        <div id="artifactListSection">
          <div th:if="${message}">
            <h3>New Artifact</h3>
            <div class="alert alert-info" th:text="${message}"></div>
          </div>

          <div th:if="${message == null}">
            <div th:each="entry : ${artifactMap}">
              <h4 th:text="${entry.key} + ' (' + ${#lists.size(entry.value)} + ')'"></h4>
              <div class="list-group mb-3">
                <div th:each="file : ${entry.value}" class="list-group-item">
                  <div>
                    <strong th:text="${file.name}"></strong>
                    <small class="text-muted ms-2" th:text="${file.packageInfo}"></small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Artifact Generator Form -->
        <div id="artifactFormSection" class="mt-5" style="display: none;">
          <h3>Create New Artifact</h3>
          <form id="artifactForm" th:action="@{'/' + ${projectName} + '/artifacts/create'}" method="post">
            <div class="mb-3">
              <label class="form-label">Artifact Type</label>
              <select id="artifactType" name="type" class="form-select" required>
                <option value="">-- Select Type --</option>
                <option value="servlet">Servlet</option>
                <option value="scheduler">Scheduler</option>
                <option value="listener">Listener</option>
                <option value="service">Service</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Class Name</label>
              <input type="text" name="name" class="form-control" placeholder="MyExample" required>
            </div>

            <!-- Dynamic Fields -->
            <div id="dynamicFields"></div>

            <div class="mt-3">
              <button type="submit" class="btn btn-success">Generate Artifact</button>
              <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right: Tools Library -->
      <div class="tools-section">
        <h2>🧰 Tools Library</h2>
        <p class="text-muted">Manage and add tools here.</p>

        <div class="d-flex justify-content-start mb-3">
          <button class="btn btn-primary" onclick="openToolSection()">+ Tool Library</button>
        </div>

        <!-- Inline Tool List Section (hidden by default) -->
        <div id="toolListSection" style="display: none;" class="mt-4">
          <h5>Select Tools</h5>
          <div id="inlineToolList" class="row row-cols-2 g-3"></div>
          <div class="mt-3">
            <button class="btn btn-success btn-sm" onclick="addSelectedTools()">Add Selected</button>
            <button class="btn btn-secondary btn-sm" onclick="cancelToolSelection()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Tool Modal (kept intact for future use) -->
  <div class="modal fade" id="toolModal" tabindex="-1" th:attr="data-project=${projectName}">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Select Tools</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="toolList" class="row row-cols-2 g-3"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-primary" onclick="addSelectedTools()">Add Selected</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/artifactController.js"></script>
</body>
</html>
