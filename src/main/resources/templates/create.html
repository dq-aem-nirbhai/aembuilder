<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Create AEM Project</title>

  <!-- Bootstrap + Animate.css -->
  <link rel="stylesheet" href="/css/create.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" />

  <!-- Intro.js for Quick Tour -->
  <link href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/intro.js/minified/intro.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/create.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Sticky Navbar -->
<header class="sticky-top shadow-sm bg-white z-3">
  <div th:replace="fragments/navbar :: navbar"></div>
</header>

<div class="container py-4 animate__animated animate__fadeIn">
  <div class="d-flex justify-content-between align-items-center">
    <a th:href="@{'/dashboard'}" class="btn btn-outline-secondary">← Back to Dashboard</a>
    <!-- Help / Quick Tour Button -->

  </div>
</div>

<main class="container py-4 animate__animated animate__fadeIn flex-grow-1">
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

  <form action="/save" method="post" th:object="${aemProjectModel}">
    <h2 data-intro="This is where you can create a new AEM project." data-step="1">Create AEM Project</h2>

    <!-- Project Name & Package -->
    <div class="flex-row mb-3" data-intro="Enter your project name here. The package name will auto-fill." data-step="2">
      <div class="flex-column me-3">
        <label>Project Name:</label>
        <input type="text" th:field="*{projectName}" id="projectName" required placeholder="Demo" />
        <small id="nameStatus" class="form-text"></small>
      </div>
      <div class="flex-column">
        <label>Package Name (groupId):</label>
        <input type="text" th:field="*{packageName}" id="packageName" required placeholder="com.aem.demo" />
      </div>
    </div>

    <!-- AEM Version -->
    <div data-intro="Select the AEM version for your new project." data-step="3">
      <label>AEM Version:</label>
      <select th:field="*{version}" required class="form-select mb-3">
        <option value="">-- Select AEM Version --</option>
        <option value="6.5.0">6.5.0</option>
        <option value="6.5.5">6.5.5</option>
        <option value="6.5.10">6.5.10</option>
        <option value="6.5.13">6.5.13</option>
        <option value="6.5.15">6.5.15</option>
        <option value="6.5.17">6.5.17</option>
        <option value="6.5.18">6.5.18</option>
        <option value="2023.2.12300.20230214T112441Z-230100">2023.2.12300</option>
      </select>
    </div>

    <!-- Components Section -->
    <div class="component-wrapper mb-3" data-intro="Add or remove components to include in your project." data-step="4">
      <label>Components</label>
      <ul id="selectedComponents" class="component-list mb-2">
        <li id="noComponentText">No component selected</li>
      </ul>
      <button type="button" class="btn btn-outline-primary" onclick="openComponentModal()">Add Components...</button>
    </div>

    <input type="hidden" name="selectedComponents" id="selectedComponentsInput" />

    <!-- Lombok checkbox -->
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="lombokEnabled" name="lombokEnabled" />
      <label class="form-check-label" for="lombokEnabled">Add Lombok Dependency</label>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner-border" role="status"></div>
    </div>

    <div class="d-flex justify-content-end" data-intro="Click here to generate your new AEM project." data-step="5">
      <button type="submit" class="btn btn-success">Create Project</button>
    </div>
  </form>
</main>

<!-- Component Modal -->
<div class="modal fade" id="componentModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Select Components</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="componentList" class="row row-cols-2 g-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="addSelectedComponents()">Add Selected</button>
      </div>
    </div>
  </div>
</div>

<div th:replace="fragments/navbar :: footer"></div>
</body>
</html>
