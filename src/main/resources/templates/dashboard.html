<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>AEM Builder - Dashboard</title>

  <!-- ✅ Intro.js (Quick Tour Library) -->
  <link href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/intro.js/minified/intro.min.js"></script>

  <!-- ✅ Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ✅ Animate.css -->
  <link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">
  <!-- ✅ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- ✅ Custom CSS -->
  <link href="/css/dashboard.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <div th:replace="fragments/navbar :: navbar"></div>

  <!-- Header -->
  <header class="dashboard-header animate__animated animate__fadeInDown text-center mt-3">
    <h1>AEM Builder Dashboard</h1>
    <p>Manage, track, and organize your AEM projects with ease</p>
  </header>

  <!-- Main -->
  <main class="container py-4 animate__animated animate__fadeIn flex-grow-1">

    <!-- Flash Message -->
    <div th:if="${message}" id="flashMessage" class="alert alert-success text-center shadow-sm">
      <span th:text="${message}"></span>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show text-center shadow-sm" role="alert" id="errorAlert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Actions -->
    <div class="d-flex justify-content-end mb-4">
      <a href="/create" class="btn btn-gradient me-2 shadow-sm"
         data-intro="Click here to create a new AEM project" data-step="1">
         <i class="bi bi-plus-circle me-1"></i> Create Project
      </a>

      <button class="btn btn-outline-secondary shadow-sm"
              data-bs-toggle="modal"
              data-bs-target="#importModal"
              data-intro="You can also import existing projects from ZIP or Git"
              data-step="2">
        <i class="bi bi-upload me-1"></i> Import Project
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center">

      <!-- No Projects Message -->
      <div th:if="${#lists.isEmpty(projects)}" class="col-12">
        <div class="d-flex flex-column align-items-center justify-content-center text-center py-5 empty-state">
          <i class="bi bi-archive text-primary mb-3 fs-1"></i>
          <h5 class="fw-semibold">No projects available</h5>
          <p class="text-muted mb-4">Let’s get started by clicking on <strong>Create Project</strong>.</p>
        </div>
      </div>

      <!-- Project Cards -->
      <div class="col" th:each="project : ${projects}">
        <div class="card project-card shadow-sm h-100 border-0 animate__animated animate__fadeInUp">

          <!-- Delete Button (Top Right Corner) -->
          <form th:action="@{'/delete/' + ${project.name}}" method="post" class="position-absolute top-0 end-0 m-2">
            <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this project?');" aria-label="Delete Project">
              🗑️
            </button>
          </form>

          <div class="card-body">
            <h5 class="card-title" th:text="${project.displayName}"></h5>
            <p><strong>Artifact-Id:</strong> <span class="badge bg-info text-dark" th:text="${project.name}"></span></p>
            <p><strong>Version:</strong> <span class="badge bg-info text-dark" th:text="${project.version}"></span></p>
            <p><strong>Package:</strong> <span th:text="${project.groupId}"></span></p>
            <p th:if="${project.createdDate != 'Unknown'}">
              <strong>Created:</strong> <span th:text="${project.createdDate}"></span>
            </p>
            <p th:if="${project.importDate != 'Unknown'}">
              <strong>Imported:</strong> <span th:text="${project.importDate}"></span>
            </p>
            <p th:if="${project.cloneDate != 'Unknown'}">
              <strong>Cloned:</strong> <span th:text="${project.cloneDate}"></span>
            </p>
            <p><strong>Path:</strong> <span th:text="${project.path}"></span></p>
          </div>

          <div class="card-footer d-flex justify-content-between flex-wrap gap-2"
               data-intro="Each project provides quick actions here — let's explore them!"
               data-step="4">
            <a th:href="@{'/view/' + ${project.name}}"
               class="btn btn-outline-primary btn-sm"
               data-intro="Click to view this project's full structure and details."
               data-step="5">
               <i class="bi bi-eye"></i> View
            </a>

            <a th:href="@{'/show-folder?path=' + ${project.path}}"
               class="btn btn-outline-secondary btn-sm"
               data-intro="Open the folder where this project is stored on your system."
               data-step="6">
               <i class="bi bi-folder2-open"></i> Show in Folder
            </a>

            <a th:href="@{'/download/' + ${project.name}}"
               class="btn btn-outline-success btn-sm"
               data-intro="Download the project as a ZIP file for backup or sharing."
               data-step="7">
               ⬇️ Download Zip
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Import Modal -->
  <div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="importForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-upload me-2"></i>Import AEM Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="file" id="zipFile" name="file" class="form-control" accept=".zip">
          <input type="url" id="repoUrl" name="repoUrl" class="form-control mt-3" placeholder="Enter repository URL to clone">
          <div id="importFeedback" class="mt-2"></div>
        </div>
        <div class="modal-footer">
          <button id="uploadBtn" class="btn btn-gradient" type="submit" disabled>
            <span id="uploadSpinner" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true" style="display:none;"></span>
            <i class="bi bi-cloud-arrow-up me-1"></i> Upload
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto" th:replace="fragments/navbar :: footer"></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dashboard.js"></script>

</body>
</html>
